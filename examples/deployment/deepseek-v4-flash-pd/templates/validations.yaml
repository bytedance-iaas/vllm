{{- if ne (int .Values.global.gpuCount) 8 -}}
{{- fail "global.gpuCount must be 8: this chart models the servingkit-equivalent 1P1D shape where prefill and decode each request one full 8-GPU node" -}}
{{- end -}}
{{- if not .Values.prefill.nodeAffinity.enabled -}}
{{- fail "prefill.nodeAffinity.enabled must be true and pinned to an explicit 8-GPU node" -}}
{{- end -}}
{{- if not .Values.decode.nodeAffinity.enabled -}}
{{- fail "decode.nodeAffinity.enabled must be true and pinned to an explicit 8-GPU node" -}}
{{- end -}}
{{- if empty .Values.prefill.nodeAffinity.values -}}
{{- fail "prefill.nodeAffinity.values must contain at least one explicit 8-GPU node" -}}
{{- end -}}
{{- if empty .Values.decode.nodeAffinity.values -}}
{{- fail "decode.nodeAffinity.values must contain at least one explicit 8-GPU node" -}}
{{- end -}}
{{- $decodeNodes := .Values.decode.nodeAffinity.values -}}
{{- range $prefillNode := .Values.prefill.nodeAffinity.values -}}
{{- if has $prefillNode $decodeNodes -}}
{{- fail (printf "prefill and decode nodeAffinity values must be disjoint because each role requests 8 GPUs; overlapping node: %s" $prefillNode) -}}
{{- end -}}
{{- end -}}
