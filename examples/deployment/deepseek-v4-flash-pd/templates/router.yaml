{{- if .Values.router.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deepseek-v4-flash-pd.routerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deepseek-v4-flash-pd.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  replicas: {{ .Values.router.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "deepseek-v4-flash-pd.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: router
  template:
    metadata:
      labels:
        {{- include "deepseek-v4-flash-pd.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: router
    spec:
      serviceAccountName: {{ include "deepseek-v4-flash-pd.routerName" . }}
      {{- if .Values.router.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      hostIPC: {{ .Values.security.hostIPC }}
      hostPID: false
      {{- if .Values.router.nodeAffinity.enabled }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: {{ .Values.router.nodeAffinity.key }}
                    operator: {{ .Values.router.nodeAffinity.operator }}
                    values:
{{ toYaml .Values.router.nodeAffinity.values | nindent 22 }}
      {{- end }}
      volumes:
        - name: models
          hostPath:
            path: {{ .Values.volumes.models.hostPath }}
            type: DirectoryOrCreate
        - name: logs
          hostPath:
            path: {{ .Values.volumes.logs.hostPath }}
            type: DirectoryOrCreate
        - name: shared-mem
          emptyDir:
            medium: {{ .Values.volumes.sharedMem.medium | quote }}
        - name: nvidia-topologyd
          hostPath:
            path: {{ .Values.volumes.nvidiaTopologyd.hostPath }}
            type: DirectoryOrCreate
        - name: config-volume
          configMap:
            name: {{ include "deepseek-v4-flash-pd.configMapName" . }}
            defaultMode: 0755
      containers:
        - name: router
          image: {{ include "deepseek-v4-flash-pd.routerImage" . }}
          imagePullPolicy: {{ .Values.router.imagePullPolicy }}
          command: ["bash", "-lc"]
          args:
            - /opt/vllm-config/start-router.sh
          env:
{{- range $name, $value := .Values.env.common }}
            - name: {{ $name }}
              value: {{ $value | quote }}
{{- end }}
{{- range $name, $value := .Values.env.router }}
            - name: {{ $name }}
              value: {{ $value | quote }}
{{- end }}
{{- range $name, $value := .Values.router.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
{{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.router.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: {{ .Values.router.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: {{ .Values.router.port }}
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            privileged: {{ .Values.security.privileged }}
            allowPrivilegeEscalation: {{ .Values.security.allowPrivilegeEscalation }}
          volumeMounts:
            - name: models
              mountPath: {{ .Values.model.basePath }}
            - name: logs
              mountPath: /data/logs
            - name: shared-mem
              mountPath: /dev/shm
            - name: nvidia-topologyd
              mountPath: /var/run/nvidia-topologyd
            - name: config-volume
              mountPath: /opt/vllm-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "deepseek-v4-flash-pd.routerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deepseek-v4-flash-pd.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  type: {{ .Values.router.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "deepseek-v4-flash-pd.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: router
  ports:
    - name: http
      port: {{ .Values.router.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.router.service.type "NodePort") .Values.router.service.nodePort }}
      nodePort: {{ .Values.router.service.nodePort }}
      {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "deepseek-v4-flash-pd.routerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deepseek-v4-flash-pd.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "deepseek-v4-flash-pd.routerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deepseek-v4-flash-pd.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "deepseek-v4-flash-pd.routerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deepseek-v4-flash-pd.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "deepseek-v4-flash-pd.routerName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "deepseek-v4-flash-pd.routerName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
