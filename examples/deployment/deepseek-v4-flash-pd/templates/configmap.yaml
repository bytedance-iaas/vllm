apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "deepseek-v4-flash-pd.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deepseek-v4-flash-pd.labels" . | nindent 4 }}
data:
  nccl_env.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    devs=()
    ports=()
    idxes=()
    rdmaIdx=""
    rdmaRate=""
    rdmaErr=""

    scan_devices() {
      allocDevs=()
      for d in $(ls /sys/class/infiniband/); do
        allocDevs+=($d)
      done
      for d in "${allocDevs[@]}"; do
        for p in $(ls /sys/class/infiniband/$d/ports/); do
          for g in $(ls /sys/class/infiniband/$d/ports/$p/gids/); do
            gid=$(cat /sys/class/infiniband/$d/ports/$p/gids/$g)
            if [ "$(echo $gid | cut -d ":" -f -1)" != "0000" ]; then
              continue
            fi
            if [ "$gid" = "0000:0000:0000:0000:0000:0000:0000:0000" ]; then
              continue
            fi
            roce_ver=$(cat /sys/class/infiniband/$d/ports/$p/gid_attrs/types/$g 2>/dev/null | grep -o "[Vv].*")
            if [ "${roce_ver,,}" != "v2" ]; then
              continue
            fi
            eth_dev=$(cat /sys/class/infiniband/$d/ports/$p/gid_attrs/ndevs/$g 2>/dev/null)
            if [[ ! -f /sys/class/net/$eth_dev/dev_id ]] || [[ ! -f /sys/class/net/$eth_dev/carrier ]] || (( ! $(cat /sys/class/net/$eth_dev/carrier 2>/dev/null) == 1 )); then
              continue
            fi
            devs+=($d)
            ports+=($p)
            idxes+=($g)
          done
        done
      done
      if [[ -z $devs ]]; then
        echo "Not found RDMA device"
        return 1
      fi
    }

    export_nccl_env() {
      scan_devices
      if [[ -z $devs ]]; then
        echo "Not found RDMA device, get max rate device error"
        return 1
      fi
      for ((i=0; i<${#devs[@]}; i+=1)); do
        rate=$(cat /sys/class/infiniband/${devs[i]}/ports/${ports[i]}/rate 2>/dev/null | cut -f 1 -d " ")
        if [[ -z "$rdmaRate" ]] || [[ "$rate" -gt "$rdmaRate" ]]; then
          rdmaDevs=(${devs[i]})
          rdmaPorts=(${ports[i]})
          rdmaIdx=${idxes[i]}
          rdmaErr=""
          rdmaRate=$rate
        elif [[ "$rate" == "$rdmaRate" ]]; then
          rdmaDevs+=(${devs[i]})
          rdmaPorts+=(${ports[i]})
          if [[ "$rdmaIdx" != "${idxes[i]}" ]]; then
            rdmaErr="rdma devs index inconsistent"
          fi
        fi
      done
      if [[ -n $rdmaErr ]]; then
        echo "$rdmaErr"
        return 1
      fi
      hca=()
      for ((i=0; i<${#rdmaDevs[@]}; i+=1)); do
        hca+=("${rdmaDevs[i]}:${rdmaPorts[i]}")
      done
      IFS=","; export NCCL_IB_HCA=${hca[*]}; unset IFS
      export NCCL_IB_GID_INDEX=$rdmaIdx
    }

    export_nccl_env
  start-prefill.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    ulimit -l unlimited || true
    ulimit -s 67108864 || true
    export ROLE_ALL2ALL_BACKEND={{ .Values.prefill.args.all2allBackend | quote }}
    export VLLM_KV_CONNECTOR={{ .Values.vllm.kvTransfer.kv_connector | quote }}
    source /opt/vllm-config/nccl_env.sh || true

    args=(
      {{ include "deepseek-v4-flash-pd.modelPath" . | quote }}
      "--served-model-name" {{ .Values.model.servedName | quote }}
      {{- if .Values.vllm.trustRemoteCode }}
      "--trust-remote-code"
      {{- end }}
      "--kv-cache-dtype" {{ .Values.vllm.kvCacheDtype | quote }}
      "--block-size" {{ .Values.vllm.blockSize | quote }}
      "--port" {{ .Values.prefill.port | quote }}
      "--data-parallel-size" {{ .Values.prefill.args.dataParallelSize | quote }}
      "--data-parallel-size-local" {{ .Values.prefill.args.dataParallelSizeLocal | quote }}
      "--data-parallel-start-rank" {{ .Values.prefill.args.dataParallelStartRank | quote }}
      "--data-parallel-address" "${HOST_IP}"
      "--data-parallel-rpc-port" {{ .Values.prefill.args.dataParallelRpcPort | quote }}
      {{- if .Values.vllm.enableExpertParallel }}
      "--enable-expert-parallel"
      {{- end }}
      {{- if .Values.prefill.args.all2allBackend }}
      "--all2all-backend" {{ .Values.prefill.args.all2allBackend | quote }}
      {{- end }}
      {{- if .Values.prefill.args.noAsyncScheduling }}
      "--no-async-scheduling"
      {{- end }}
      "--tokenizer-mode" {{ .Values.vllm.tokenizerMode | quote }}
      "--tool-call-parser" {{ .Values.vllm.toolCallParser | quote }}
      {{- if .Values.vllm.enableAutoToolChoice }}
      "--enable-auto-tool-choice"
      {{- end }}
      "--reasoning-parser" {{ .Values.vllm.reasoningParser | quote }}
      "--max-model-len" {{ .Values.vllm.maxModelLen | quote }}
      "--max-num-batched-tokens" {{ .Values.prefill.args.maxNumBatchedTokens | quote }}
      "--max-num-seqs" {{ .Values.prefill.args.maxNumSeqs | quote }}
      {{- if .Values.prefill.args.enforceEager }}
      "--enforce-eager"
      {{- end }}
      {{- if .Values.vllm.enableSleepMode }}
      "--enable-sleep-mode"
      {{- end }}
      {{- if .Values.vllm.noDisableHybridKvCacheManager }}
      "--no-disable-hybrid-kv-cache-manager"
      {{- end }}
      {{- if .Values.vllm.disableUvicornAccessLog }}
      "--disable-uvicorn-access-log"
      {{- end }}
      "--kv-transfer-config" '{{ include "deepseek-v4-flash-pd.kvTransferConfigJson" . }}'
      {{- range .Values.prefill.extraArgs }}
      {{ . | quote }}
      {{- end }}
    )

    exec vllm serve "${args[@]}"
  start-decode.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    ulimit -l unlimited || true
    ulimit -s 67108864 || true
    export ROLE_ALL2ALL_BACKEND={{ .Values.decode.args.all2allBackend | quote }}
    export VLLM_KV_CONNECTOR={{ .Values.vllm.kvTransfer.kv_connector | quote }}
    source /opt/vllm-config/nccl_env.sh || true

    args=(
      {{ include "deepseek-v4-flash-pd.modelPath" . | quote }}
      "--served-model-name" {{ .Values.model.servedName | quote }}
      {{- if .Values.vllm.trustRemoteCode }}
      "--trust-remote-code"
      {{- end }}
      "--kv-cache-dtype" {{ .Values.vllm.kvCacheDtype | quote }}
      "--block-size" {{ .Values.vllm.blockSize | quote }}
      "--port" {{ .Values.decode.port | quote }}
      "--data-parallel-size" {{ .Values.decode.args.dataParallelSize | quote }}
      "--data-parallel-size-local" {{ .Values.decode.args.dataParallelSizeLocal | quote }}
      "--data-parallel-start-rank" {{ .Values.decode.args.dataParallelStartRank | quote }}
      "--data-parallel-address" "${HOST_IP}"
      "--data-parallel-rpc-port" {{ .Values.decode.args.dataParallelRpcPort | quote }}
      {{- if .Values.vllm.enableExpertParallel }}
      "--enable-expert-parallel"
      {{- end }}
      {{- if .Values.decode.args.all2allBackend }}
      "--all2all-backend" {{ .Values.decode.args.all2allBackend | quote }}
      {{- end }}
      "--tokenizer-mode" {{ .Values.vllm.tokenizerMode | quote }}
      "--tool-call-parser" {{ .Values.vllm.toolCallParser | quote }}
      {{- if .Values.vllm.enableAutoToolChoice }}
      "--enable-auto-tool-choice"
      {{- end }}
      "--reasoning-parser" {{ .Values.vllm.reasoningParser | quote }}
      "--max-model-len" {{ .Values.vllm.maxModelLen | quote }}
      "--max-num-seqs" {{ .Values.decode.args.maxNumSeqs | quote }}
      "--max-num-batched-tokens" {{ .Values.decode.args.maxNumBatchedTokens | quote }}
      "--compilation-config" {{ .Values.decode.args.compilationConfig | quote }}
      {{- if .Values.vllm.enableSleepMode }}
      "--enable-sleep-mode"
      {{- end }}
      {{- if .Values.vllm.noDisableHybridKvCacheManager }}
      "--no-disable-hybrid-kv-cache-manager"
      {{- end }}
      {{- if .Values.vllm.disableUvicornAccessLog }}
      "--disable-uvicorn-access-log"
      {{- end }}
      "--kv-transfer-config" '{{ include "deepseek-v4-flash-pd.kvTransferConfigJson" . }}'
      {{- range .Values.decode.extraArgs }}
      {{ . | quote }}
      {{- end }}
    )

    exec vllm serve "${args[@]}"
  start-router.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    command -v vllm-router >/dev/null 2>&1

    args=(
      "--policy" {{ .Values.router.policy | quote }}
      "--vllm-pd-disaggregation"
      {{- if .Values.router.serviceDiscovery.enabled }}
      "--service-discovery"
      "--service-discovery-port" {{ .Values.router.serviceDiscovery.port | quote }}
      "--service-discovery-namespace" {{ .Release.Namespace | quote }}
      "--prefill-selector" {{ printf "storm-service-name=%s" (include "deepseek-v4-flash-pd.fullname" .) | quote }} "role-name=prefill"
      "--decode-selector" {{ printf "storm-service-name=%s" (include "deepseek-v4-flash-pd.fullname" .) | quote }} "role-name=decode"
      {{- end }}
      "--host" {{ .Values.router.host | quote }}
      "--port" {{ .Values.router.port | quote }}
      "--intra-node-data-parallel-size" {{ .Values.router.intraNodeDataParallelSize | quote }}
      "--kv-connector" {{ .Values.router.kvConnector | quote }}
      {{- range .Values.router.extraArgs }}
      {{ . | quote }}
      {{- end }}
    )

    exec vllm-router "${args[@]}"
