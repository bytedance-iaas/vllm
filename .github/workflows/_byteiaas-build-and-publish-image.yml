name: ByteIAAS Build And Publish vLLM Image

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to checkout"
        required: false
        type: string
        default: ""
      cuda_version:
        description: "CUDA_VERSION build arg"
        required: false
        type: string
        default: "13.0.3"
      tag_mode:
        description: "Image tag mode: dev or release"
        required: true
        type: string
      tag_value:
        description: "Internal tag value required for release mode"
        required: false
        type: string
        default: ""
      vllm_version:
        description: "Explicit vLLM version override"
        required: false
        type: string
        default: ""
      image_formats:
        description: "CSV of image formats to publish: oci,zstd,nydus"
        required: false
        type: string
        default: "oci,zstd,nydus"

jobs:
  build-and-publish-image:
    if: github.repository == 'bytedance-iaas/vllm'
    name: build-and-publish-image
    runs-on:
      - self-hosted
      - x64-vllm-docker-build-node
      - vllm-byteiaas-build-02
    timeout-minutes: 1440
    env:
      HTTP_PROXY: http://100.68.162.211:3128
      HTTPS_PROXY: http://100.68.162.211:3128
      ALL_PROXY: http://100.68.162.211:3128
      NO_PROXY: localhost,127.0.0.1,::1,mirrors.ivolces.com,.ivolces.com,.volceapi.com,.byted.org,eic-sdk-release.tos-cn-beijing.ivolces.com,scqq9isgq31i0fb8nt4eg.apigateway-cn-beijing.volceapi.com,bytedpypi.byted.org,mirrors.byted.org,iaas-gpu-cn-beijing.cr.volces.com
      VOLCENGINE_CR_REGISTRY: ${{ vars.VOLCENGINE_CR_REGISTRY }}
      VOLCENGINE_CR_NAMESPACE: ${{ vars.VOLCENGINE_CR_NAMESPACE }}
      VOLCENGINE_CR_REPOSITORY: ${{ vars.VOLCENGINE_CR_REPOSITORY || 'vllm' }}
      VOLCENGINE_CR_USERNAME: ${{ secrets.VOLCENGINE_CR_USERNAME }}
      VOLCENGINE_CR_PASSWORD: ${{ secrets.VOLCENGINE_CR_PASSWORD }}
      BYTEIAAS_BUILDX_CACHE_ROOT: /data/buildkit/byteiaas-vllm-image-cache
      BYTEIAAS_DEEPGEMM_GIT_REPOSITORY: https://github.com/wangyicong52/DeepGEMM.git
      BYTEIAAS_DEEPGEMM_GIT_COMMIT: babdbf01ceacc407531b71920600e4a349d7e205
      BYTEIAAS_HPC_OPS_REPO: https://github.com/wangyicong52/hpc-ops.git
      BYTEIAAS_HPC_OPS_REF: 915755b437257e1118a80f5cbb07509037faad05
      BYTEIAAS_VLLM_ROUTER_VERSION: "0.1.15"
      BYTEIAAS_CUDA_VERSION: ${{ inputs.cuda_version }}
      BYTEIAAS_TAG_MODE: ${{ inputs.tag_mode }}
      BYTEIAAS_TAG_VALUE: ${{ inputs.tag_value }}
      BYTEIAAS_VLLM_VERSION: ${{ inputs.vllm_version }}
      BYTEIAAS_IMAGE_FORMATS: ${{ inputs.image_formats }}
    steps:
      - name: Cleanup workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE"/* || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Validate build inputs
        run: |
          set -euo pipefail
          if [ "${BYTEIAAS_CUDA_VERSION}" != "13.0.3" ]; then
            echo "::error::ByteIAAS builds require CUDA 13.0.3"
            exit 1
          fi
          if [ "${BYTEIAAS_TAG_MODE}" != "dev" ] && [ "${BYTEIAAS_TAG_MODE}" != "release" ]; then
            echo "::error::tag_mode must be dev or release"
            exit 1
          fi
          if [ "${BYTEIAAS_TAG_MODE}" = "release" ] && [ -z "${BYTEIAAS_TAG_VALUE}" ]; then
            echo "::error::tag_value is required in release mode"
            exit 1
          fi

      - name: Resolve Volcengine publish target
        run: |
          set -euo pipefail
          if [ -z "${VOLCENGINE_CR_REGISTRY}" ] || [ -z "${VOLCENGINE_CR_NAMESPACE}" ]; then
            echo "::error::VOLCENGINE_CR_REGISTRY and VOLCENGINE_CR_NAMESPACE variables are required"
            exit 1
          fi
          if [ -z "${VOLCENGINE_CR_USERNAME}" ] || [ -z "${VOLCENGINE_CR_PASSWORD}" ]; then
            echo "::error::VOLCENGINE_CR_USERNAME and VOLCENGINE_CR_PASSWORD secrets are required"
            exit 1
          fi
          IMAGE_REPO="${VOLCENGINE_CR_REGISTRY}/${VOLCENGINE_CR_NAMESPACE}/${VOLCENGINE_CR_REPOSITORY}"
          echo "IMAGE_REPO=${IMAGE_REPO}" >> "${GITHUB_ENV}"

      - name: Resolve ByteIAAS image tags
        id: image-tags
        run: |
          set -euo pipefail
          timestamp="$(TZ=Asia/Shanghai date +%Y%m%d%H%M)"
          common_args=(
            --mode "${BYTEIAAS_TAG_MODE}"
            --cuda-suffix cu130
            --timestamp "${timestamp}"
          )
          if [ -n "${BYTEIAAS_TAG_VALUE}" ]; then
            common_args+=(--tag-value "${BYTEIAAS_TAG_VALUE}")
          fi
          if [ -n "${BYTEIAAS_VLLM_VERSION}" ]; then
            common_args+=(--vllm-version "${BYTEIAAS_VLLM_VERSION}")
          fi

          openai_tag="$(
            python3 scripts/ci/get_byteiaas_image_tag.py \
              "${common_args[@]}" --image-flavor openai
          )"
          openai_devel_tag="$(
            python3 scripts/ci/get_byteiaas_image_tag.py \
              "${common_args[@]}" --image-flavor openai-devel
          )"
          openai_zstd_tag="$(
            python3 scripts/ci/get_byteiaas_image_tag.py \
              "${common_args[@]}" --image-flavor openai --format-suffix zstd
          )"
          openai_devel_zstd_tag="$(
            python3 scripts/ci/get_byteiaas_image_tag.py \
              "${common_args[@]}" --image-flavor openai-devel \
              --format-suffix zstd
          )"
          openai_nydus_tag="$(
            python3 scripts/ci/get_byteiaas_image_tag.py \
              "${common_args[@]}" --image-flavor openai --format-suffix nydus
          )"
          openai_devel_nydus_tag="$(
            python3 scripts/ci/get_byteiaas_image_tag.py \
              "${common_args[@]}" --image-flavor openai-devel \
              --format-suffix nydus
          )"
          echo "openai_image_tag=${openai_tag}" >> "${GITHUB_OUTPUT}"
          echo "openai_devel_image_tag=${openai_devel_tag}" >> "${GITHUB_OUTPUT}"
          echo "openai_zstd_image_tag=${openai_zstd_tag}" >> "${GITHUB_OUTPUT}"
          echo "openai_devel_zstd_image_tag=${openai_devel_zstd_tag}" >> "${GITHUB_OUTPUT}"
          echo "openai_nydus_image_tag=${openai_nydus_tag}" >> "${GITHUB_OUTPUT}"
          echo "openai_devel_nydus_image_tag=${openai_devel_nydus_tag}" >> "${GITHUB_OUTPUT}"

      - name: Validate requested image formats
        id: image-formats
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os

          raw = os.environ.get("BYTEIAAS_IMAGE_FORMATS", "oci,zstd,nydus")
          formats = [item.strip() for item in raw.split(",") if item.strip()]
          if not formats:
              formats = ["oci", "zstd", "nydus"]
          allowed = {"oci", "zstd", "nydus"}
          unknown = sorted(set(formats) - allowed)
          if unknown:
              raise SystemExit(
                  f"unknown image formats: {unknown}; allowed: {sorted(allowed)}"
              )
          selected = set(formats)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for image_format in sorted(allowed):
                  enabled = str(image_format in selected).lower()
                  output.write(f"{image_format}={enabled}\n")
          print(f"Requested image formats: {formats}")
          PY

      - name: Set up Docker Buildx with local Docker Hub mirror
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["127.0.0.1:5000"]
          cleanup: false

      - name: Login to Volcengine CR
        run: |
          set -euo pipefail
          echo "${VOLCENGINE_CR_PASSWORD}" | docker login \
            "${VOLCENGINE_CR_REGISTRY}" \
            --username "${VOLCENGINE_CR_USERNAME}" \
            --password-stdin

      - name: Build and push AMD64 images by digest
        id: build
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          openai_metadata="/tmp/byteiaas-vllm-openai-image.json"
          devel_metadata="/tmp/byteiaas-vllm-openai-devel-image.json"
          openai_zstd_metadata="/tmp/byteiaas-vllm-openai-zstd-image.json"
          devel_zstd_metadata="/tmp/byteiaas-vllm-openai-devel-zstd-image.json"
          build_cpus="$(nproc)"
          build_max_jobs="${BYTEIAAS_BUILD_MAX_JOBS:-${build_cpus}}"
          default_nvcc_threads=4
          if [ "${build_cpus}" -lt "${default_nvcc_threads}" ]; then
            default_nvcc_threads="${build_cpus}"
          fi
          build_nvcc_threads="${BYTEIAAS_BUILD_NVCC_THREADS:-${default_nvcc_threads}}"
          cache_root="${BYTEIAAS_BUILDX_CACHE_ROOT}"
          build_commit="$(git rev-parse HEAD)"
          build_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          image_source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          mkdir -p "${cache_root}"

          buildx_with_local_cache() {
            local cache_name="$1"
            shift
            local cache_dir="${cache_root}/${cache_name}"
            local cache_new="${cache_dir}.new"
            local cache_old="${cache_dir}.old"
            local cache_args=(--cache-to "type=local,dest=${cache_new},mode=max")
            if [ -d "${cache_dir}" ]; then
              cache_args=(
                --cache-from "type=local,src=${cache_dir}"
                "${cache_args[@]}"
              )
            fi

            rm -rf "${cache_new}"
            docker buildx build \
              --builder "${BUILDX_BUILDER}" \
              "${cache_args[@]}" \
              "$@"

            if [ -d "${cache_new}" ]; then
              rm -rf "${cache_old}"
              if [ -d "${cache_dir}" ]; then
                mv "${cache_dir}" "${cache_old}"
              fi
              mv "${cache_new}" "${cache_dir}"
              rm -rf "${cache_old}"
            fi
          }

          buildx_from_local_cache() {
            local cache_name="$1"
            shift
            local cache_dir="${cache_root}/${cache_name}"
            if [ ! -d "${cache_dir}" ]; then
              echo "::error::Expected local BuildKit cache is missing: ${cache_dir}"
              return 1
            fi
            docker buildx build \
              --builder "${BUILDX_BUILDER}" \
              --cache-from "type=local,src=${cache_dir}" \
              "$@"
          }

          build_openai() {
            local cache_mode="$1"
            local output_options="$2"
            local metadata_path="$3"
            local image_label="$4"
            local build_args=(
              --target vllm-openai
              --platform linux/amd64
              --output "type=image,name=${IMAGE_REPO},push-by-digest=true,name-canonical=true,push=true${output_options}"
              -f docker/Dockerfile
              --build-arg CUDA_VERSION="${BYTEIAAS_CUDA_VERSION}"
              --build-arg BUILD_BASE_IMAGE="127.0.0.1:5000/nvidia/cuda:${BYTEIAAS_CUDA_VERSION}-devel-ubuntu22.04"
              --build-arg FINAL_BASE_IMAGE="nvidia/cuda:${BYTEIAAS_CUDA_VERSION}-base-ubuntu22.04"
              --build-arg DEEPGEMM_GIT_REPOSITORY="${BYTEIAAS_DEEPGEMM_GIT_REPOSITORY}"
              --build-arg DEEPGEMM_GIT_COMMIT="${BYTEIAAS_DEEPGEMM_GIT_COMMIT}"
              --build-arg DEEPGEMM_REQUIRE_SM90_MEGA_MOE=ON
              --build-arg INSTALL_KV_CONNECTORS=true
              --build-arg INSTALL_VLLM_ROUTER=true
              --build-arg VLLM_ROUTER_VERSION="${BYTEIAAS_VLLM_ROUTER_VERSION}"
              --build-arg INSTALL_HPC_OPS=true
              --build-arg HPC_OPS_REPO="${BYTEIAAS_HPC_OPS_REPO}"
              --build-arg HPC_OPS_REF="${BYTEIAAS_HPC_OPS_REF}"
              --build-arg VLLM_BUILD_COMMIT="${build_commit}"
              --build-arg VLLM_BUILD_PIPELINE="${GITHUB_WORKFLOW}"
              --build-arg VLLM_BUILD_URL="${build_url}"
              --build-arg VLLM_IMAGE_TAG="${IMAGE_REPO}:${image_label}"
              --build-arg VLLM_IMAGE_SOURCE="${image_source}"
              --build-arg max_jobs="${build_max_jobs}"
              --build-arg nvcc_threads="${build_nvcc_threads}"
              --build-arg HTTP_PROXY="${HTTP_PROXY}"
              --build-arg HTTPS_PROXY="${HTTPS_PROXY}"
              --build-arg ALL_PROXY="${ALL_PROXY}"
              --build-arg NO_PROXY="${NO_PROXY}"
              --build-arg http_proxy="${HTTP_PROXY}"
              --build-arg https_proxy="${HTTPS_PROXY}"
              --build-arg all_proxy="${ALL_PROXY}"
              --build-arg no_proxy="${NO_PROXY}"
              --metadata-file "${metadata_path}"
              .
            )
            if [ "${cache_mode}" = "write" ]; then
              buildx_with_local_cache openai "${build_args[@]}"
            else
              buildx_from_local_cache openai "${build_args[@]}"
            fi
          }

          build_devel() {
            local cache_mode="$1"
            local output_options="$2"
            local base_digest="$3"
            local metadata_path="$4"
            local image_label="$5"
            local build_args=(
              --platform linux/amd64
              --output "type=image,name=${IMAGE_REPO},push-by-digest=true,name-canonical=true,push=true${output_options}"
              -f docker/byteiaas-openai-devel.Dockerfile
              --build-arg "VLLM_OPENAI_DEVEL_BASE_IMAGE=${IMAGE_REPO}@${base_digest}"
              --build-arg CUDA_VERSION="${BYTEIAAS_CUDA_VERSION}"
              --build-arg VLLM_BUILD_COMMIT="${build_commit}"
              --build-arg VLLM_BUILD_PIPELINE="${GITHUB_WORKFLOW}"
              --build-arg VLLM_BUILD_URL="${build_url}"
              --build-arg VLLM_IMAGE_TAG="${IMAGE_REPO}:${image_label}"
              --build-arg VLLM_IMAGE_SOURCE="${image_source}"
              --build-arg HTTP_PROXY="${HTTP_PROXY}"
              --build-arg HTTPS_PROXY="${HTTPS_PROXY}"
              --build-arg ALL_PROXY="${ALL_PROXY}"
              --build-arg NO_PROXY="${NO_PROXY}"
              --build-arg http_proxy="${HTTP_PROXY}"
              --build-arg https_proxy="${HTTPS_PROXY}"
              --build-arg all_proxy="${ALL_PROXY}"
              --build-arg no_proxy="${NO_PROXY}"
              --metadata-file "${metadata_path}"
              .
            )
            if [ "${cache_mode}" = "write" ]; then
              buildx_with_local_cache openai-devel "${build_args[@]}"
            else
              buildx_from_local_cache openai-devel "${build_args[@]}"
            fi
          }

          read_digest() {
            python3 -c \
              'import json, sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' \
              "$1"
          }

          validate_digest() {
            local digest="$1"
            if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid image digest: ${digest}"
              return 1
            fi
            docker buildx imagetools inspect "${IMAGE_REPO}@${digest}" >/dev/null
          }

          build_openai write "" "${openai_metadata}" \
            "${{ steps.image-tags.outputs.openai_image_tag }}"
          openai_digest="$(read_digest "${openai_metadata}")"
          validate_digest "${openai_digest}"

          build_devel write "" "${openai_digest}" "${devel_metadata}" \
            "${{ steps.image-tags.outputs.openai_devel_image_tag }}"
          devel_digest="$(read_digest "${devel_metadata}")"
          validate_digest "${devel_digest}"

          echo "openai_digest=${openai_digest}" >> "${GITHUB_OUTPUT}"
          echo "openai_devel_digest=${devel_digest}" >> "${GITHUB_OUTPUT}"

          if [ "${{ steps.image-formats.outputs.zstd }}" = "true" ]; then
            zstd_options=",compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true"
            build_openai read "${zstd_options}" "${openai_zstd_metadata}" \
              "${{ steps.image-tags.outputs.openai_zstd_image_tag }}"
            openai_zstd_digest="$(read_digest "${openai_zstd_metadata}")"
            validate_digest "${openai_zstd_digest}"

            build_devel read "${zstd_options}" \
              "${openai_zstd_digest}" "${devel_zstd_metadata}" \
              "${{ steps.image-tags.outputs.openai_devel_zstd_image_tag }}"
            devel_zstd_digest="$(read_digest "${devel_zstd_metadata}")"
            validate_digest "${devel_zstd_digest}"

            echo "openai_zstd_digest=${openai_zstd_digest}" >> "${GITHUB_OUTPUT}"
            echo "openai_devel_zstd_digest=${devel_zstd_digest}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create Volcengine OCI image tags
        if: ${{ steps.image-formats.outputs.oci == 'true' }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${IMAGE_REPO}:${{ steps.image-tags.outputs.openai_image_tag }}" \
            "${IMAGE_REPO}@${{ steps.build.outputs.openai_digest }}"
          docker buildx imagetools create \
            -t "${IMAGE_REPO}:${{ steps.image-tags.outputs.openai_devel_image_tag }}" \
            "${IMAGE_REPO}@${{ steps.build.outputs.openai_devel_digest }}"
          docker buildx imagetools inspect \
            "${IMAGE_REPO}:${{ steps.image-tags.outputs.openai_image_tag }}"
          docker buildx imagetools inspect \
            "${IMAGE_REPO}:${{ steps.image-tags.outputs.openai_devel_image_tag }}"

      - name: Create and verify Volcengine zstd image tags
        if: ${{ steps.image-formats.outputs.zstd == 'true' }}
        run: |
          set -euo pipefail
          openai_ref="${IMAGE_REPO}:${{ steps.image-tags.outputs.openai_zstd_image_tag }}"
          devel_ref="${IMAGE_REPO}:${{ steps.image-tags.outputs.openai_devel_zstd_image_tag }}"
          docker buildx imagetools create \
            -t "${openai_ref}" \
            "${IMAGE_REPO}@${{ steps.build.outputs.openai_zstd_digest }}"
          docker buildx imagetools create \
            -t "${devel_ref}" \
            "${IMAGE_REPO}@${{ steps.build.outputs.openai_devel_zstd_digest }}"
          python3 scripts/ci/verify_byteiaas_image_format.py \
            --format zstd "${openai_ref}" "${devel_ref}"

      - name: Install nydus tooling
        if: ${{ steps.image-formats.outputs.nydus == 'true' }}
        env:
          NYDUS_VERSION: "2.3.0"
          NYDUS_SHA256: c6bed2e26151ba07236df995553f568b9f12ce4a294df7e9373a30c05381a1a1
        run: |
          set -euo pipefail
          tarball="nydus-static-v${NYDUS_VERSION}-linux-amd64.tgz"
          url="https://github.com/dragonflyoss/nydus/releases/download/v${NYDUS_VERSION}/${tarball}"
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt ${attempt} failed; sleeping 15s"
              sleep 15
            done
            return 1
          }
          retry curl -fL --retry 5 --retry-all-errors --retry-delay 2 \
            -o "/tmp/${tarball}" "${url}"
          echo "${NYDUS_SHA256}  /tmp/${tarball}" | sha256sum --check --strict -
          tar -xzf "/tmp/${tarball}" -C /tmp
          sudo install -m 0755 \
            /tmp/nydus-static/nydusify /usr/local/bin/nydusify
          sudo install -m 0755 \
            /tmp/nydus-static/nydus-image /usr/local/bin/nydus-image
          nydusify --version
          nydus-image --version

      - name: Convert and verify nydus image digests
        if: ${{ steps.image-formats.outputs.nydus == 'true' }}
        id: nydus
        run: |
          set -euo pipefail
          retry() {
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt ${attempt} failed; sleeping 20s"
              sleep 20
            done
            return 1
          }
          resolve_digest() {
            local reference="$1"
            local manifest_file
            local digest
            manifest_file="$(mktemp)"
            docker buildx imagetools inspect --raw "${reference}" \
              > "${manifest_file}"
            digest="sha256:$(sha256sum "${manifest_file}" | awk '{print $1}')"
            rm -f "${manifest_file}"
            if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid nydus image digest: ${digest}"
              return 1
            fi
            docker buildx imagetools inspect "${IMAGE_REPO}@${digest}" >/dev/null
            printf '%s\n' "${digest}"
          }
          convert_image() {
            local source_digest="$1"
            local staging_tag="$2"
            local target="${IMAGE_REPO}:${staging_tag}"
            retry nydusify convert \
              --nydus-image /usr/local/bin/nydus-image \
              --source "${IMAGE_REPO}@${source_digest}" \
              --target "${target}" >&2
            nydusify check --target "${target}" >&2
            python3 scripts/ci/verify_byteiaas_image_format.py \
              --format nydus "${target}" >&2
            resolve_digest "${target}"
          }

          staging_prefix="staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          openai_nydus_digest="$(
            convert_image \
              "${{ steps.build.outputs.openai_digest }}" \
              "${staging_prefix}-openai-nydus"
          )"
          devel_nydus_digest="$(
            convert_image \
              "${{ steps.build.outputs.openai_devel_digest }}" \
              "${staging_prefix}-openai-devel-nydus"
          )"
          echo "openai_nydus_digest=${openai_nydus_digest}" >> "${GITHUB_OUTPUT}"
          echo "openai_devel_nydus_digest=${devel_nydus_digest}" >> "${GITHUB_OUTPUT}"

      - name: Create and verify Volcengine nydus image tags
        if: ${{ steps.image-formats.outputs.nydus == 'true' }}
        run: |
          set -euo pipefail
          openai_ref="${IMAGE_REPO}:${{ steps.image-tags.outputs.openai_nydus_image_tag }}"
          devel_ref="${IMAGE_REPO}:${{ steps.image-tags.outputs.openai_devel_nydus_image_tag }}"
          docker buildx imagetools create \
            -t "${openai_ref}" \
            "${IMAGE_REPO}@${{ steps.nydus.outputs.openai_nydus_digest }}"
          docker buildx imagetools create \
            -t "${devel_ref}" \
            "${IMAGE_REPO}@${{ steps.nydus.outputs.openai_devel_nydus_digest }}"
          python3 scripts/ci/verify_byteiaas_image_format.py \
            --format nydus "${openai_ref}" "${devel_ref}"
