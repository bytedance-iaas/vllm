name: ByteIAAS vLLM Release Build

on:
  push:
    tags:
      - "v[0-9]+*"
      - "[0-9]+*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing git tag to release when dispatching from iaas_main"
        required: true
      image_formats:
        description: "CSV of image formats to publish: oci,zstd,nydus"
        required: false
        default: "oci,zstd,nydus"

concurrency:
  group: byteiaas-vllm-release-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-release:
    if: github.repository == 'bytedance-iaas/vllm'
    runs-on: ubuntu-22.04
    outputs:
      internal_tag: ${{ steps.release.outputs.internal_tag }}
      checkout_sha: ${{ steps.release.outputs.checkout_sha }}
    steps:
      - name: Checkout trusted branch
        uses: actions/checkout@v4
        with:
          ref: refs/heads/iaas_main
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve existing release tag
        id: release
        env:
          REQUESTED_RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin \
            refs/heads/iaas_main:refs/remotes/origin/iaas_main
          raw_tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            raw_tag="${REQUESTED_RELEASE_TAG}"
          fi
          raw_tag="${raw_tag#refs/tags/}"
          if [ -z "${raw_tag}" ] || ! git rev-parse -q --verify "refs/tags/${raw_tag}" >/dev/null; then
            echo "::error::ByteIAAS release publishing requires an existing git tag ref"
            exit 1
          fi
          internal_tag="${raw_tag#v}"
          if ! printf '%s\n' "${internal_tag}" | grep -qE '^[0-9A-Za-z][0-9A-Za-z_.-]*$'; then
            echo "::error::Invalid internal tag value: ${internal_tag}"
            exit 1
          fi
          checkout_sha="$(git rev-parse --verify "refs/tags/${raw_tag}^{commit}")"
          if ! git merge-base --is-ancestor \
              "${checkout_sha}" refs/remotes/origin/iaas_main; then
            echo "::error::Release tag is not in iaas_main history"
            exit 1
          fi
          contract="$(git show "${checkout_sha}:.github/byteiaas-build-contract")"
          if [ "${contract}" != "1" ]; then
            echo "::error::Release tag lacks ByteIAAS build contract 1"
            exit 1
          fi
          python3 scripts/ci/get_byteiaas_image_tag.py \
            --mode release \
            --image-flavor openai-devel \
            --tag-value "${internal_tag}" \
            --cuda-suffix cu130 \
            --format-suffix nydus \
            --timestamp 200001010000 >/dev/null
          echo "internal_tag=${internal_tag}" >> "${GITHUB_OUTPUT}"
          echo "checkout_sha=${checkout_sha}" >> "${GITHUB_OUTPUT}"

  build-wheel:
    if: github.repository == 'bytedance-iaas/vllm'
    needs: resolve-release
    uses: ./.github/workflows/_byteiaas-build-wheel.yml
    with:
      checkout_ref: ${{ needs.resolve-release.outputs.checkout_sha }}
      cuda_version: "13.0.3"
      artifact_name: vllm-cu130-wheel-release-${{ needs.resolve-release.outputs.internal_tag }}

  build-image:
    if: github.repository == 'bytedance-iaas/vllm'
    needs: resolve-release
    uses: ./.github/workflows/_byteiaas-build-and-publish-image.yml
    with:
      checkout_ref: ${{ needs.resolve-release.outputs.checkout_sha }}
      cuda_version: "13.0.3"
      tag_mode: release
      tag_value: ${{ needs.resolve-release.outputs.internal_tag }}
      image_formats: ${{ github.event_name == 'workflow_dispatch' && inputs.image_formats || 'oci,zstd,nydus' }}
    secrets:
      VOLCENGINE_CR_USERNAME: ${{ secrets.VOLCENGINE_CR_USERNAME }}
      VOLCENGINE_CR_PASSWORD: ${{ secrets.VOLCENGINE_CR_PASSWORD }}
