name: ByteIAAS Build vLLM Wheel

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Git ref to checkout"
        required: false
        type: string
        default: ""
      cuda_version:
        description: "CUDA_VERSION build arg"
        required: false
        type: string
        default: "13.0.2"
      artifact_name:
        description: "Uploaded wheel artifact name"
        required: false
        type: string
        default: "vllm-cu130-wheel"

jobs:
  build-wheel:
    if: github.repository == 'bytedance-iaas/vllm'
    runs-on:
      - self-hosted
      - x64-vllm-wheel-build-node
      - vllm-byteiaas-build-01
    timeout-minutes: 1440
    env:
      HTTP_PROXY: http://100.68.162.211:3128
      HTTPS_PROXY: http://100.68.162.211:3128
      ALL_PROXY: http://100.68.162.211:3128
      NO_PROXY: localhost,127.0.0.1,::1,mirrors.ivolces.com,.ivolces.com,.volceapi.com,.byted.org,eic-sdk-release.tos-cn-beijing.ivolces.com,scqq9isgq31i0fb8nt4eg.apigateway-cn-beijing.volceapi.com,bytedpypi.byted.org,mirrors.byted.org,iaas-gpu-cn-beijing.cr.volces.com
      BYTEIAAS_BUILDX_CACHE_ROOT: /data/buildkit/byteiaas-vllm-wheel-cache
    steps:
      - name: Cleanup workspace
        run: sudo rm -rf "$GITHUB_WORKSPACE"/* || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx with local Docker Hub mirror
        uses: docker/setup-buildx-action@v3
        with:
          name: byteiaas-vllm-wheel-builder
          driver-opts: |
            network=host
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["127.0.0.1:5000"]
          keep-state: true
          cleanup: false

      - name: Build wheel stage image
        run: |
          set -euo pipefail
          build_cpus="$(nproc)"
          build_max_jobs="${BYTEIAAS_BUILD_MAX_JOBS:-${build_cpus}}"
          default_nvcc_threads=4
          if [ "${build_cpus}" -lt "${default_nvcc_threads}" ]; then
            default_nvcc_threads="${build_cpus}"
          fi
          build_nvcc_threads="${BYTEIAAS_BUILD_NVCC_THREADS:-${default_nvcc_threads}}"
          cache_root="${BYTEIAAS_BUILDX_CACHE_ROOT}"

          echo "Using build parallelism: max_jobs=${build_max_jobs}, nvcc_threads=${build_nvcc_threads}, cpus=${build_cpus}, effective_cuda_jobs=$((build_max_jobs / build_nvcc_threads))"
          echo "DeepGEMM Python versions: ${DEEPGEMM_PYTHON_VERSIONS:-default}"
          echo "Docker root: $(docker info --format '{{.DockerRootDir}}')"
          df -h /data /data/docker /data/buildkit || true
          mkdir -p "${cache_root}"

          buildx_with_local_cache() {
            local cache_name="$1"
            shift
            local cache_dir="${cache_root}/${cache_name}"
            local cache_new="${cache_dir}.new"
            local cache_old="${cache_dir}.old"
            local cache_args=(
              --cache-to "type=local,dest=${cache_new},mode=max"
            )
            if [ -d "${cache_dir}" ]; then
              cache_args=(
                --cache-from "type=local,src=${cache_dir}"
                "${cache_args[@]}"
              )
              echo "Using local BuildKit cache: ${cache_dir}"
            else
              echo "No local BuildKit cache yet: ${cache_dir}"
            fi

            rm -rf "${cache_new}"
            docker buildx build "${cache_args[@]}" "$@"

            if [ -d "${cache_new}" ]; then
              rm -rf "${cache_old}"
              if [ -d "${cache_dir}" ]; then
                mv "${cache_dir}" "${cache_old}"
              fi
              mv "${cache_new}" "${cache_dir}"
              rm -rf "${cache_old}"
              echo "Updated local BuildKit cache: ${cache_dir}"
            fi
          }

          buildx_with_local_cache build \
            --load \
            --target build \
            --network=host \
            -f docker/Dockerfile \
            --build-arg CUDA_VERSION=${{ inputs.cuda_version }} \
            --build-arg BUILD_BASE_IMAGE="127.0.0.1:5000/nvidia/cuda:${{ inputs.cuda_version }}-devel-ubuntu22.04" \
            --build-arg max_jobs="${build_max_jobs}" \
            --build-arg nvcc_threads="${build_nvcc_threads}" \
            --build-arg HTTP_PROXY="${HTTP_PROXY}" \
            --build-arg HTTPS_PROXY="${HTTPS_PROXY}" \
            --build-arg ALL_PROXY="${ALL_PROXY}" \
            --build-arg NO_PROXY="${NO_PROXY}" \
            --build-arg http_proxy="${HTTP_PROXY}" \
            --build-arg https_proxy="${HTTPS_PROXY}" \
            --build-arg all_proxy="${ALL_PROXY}" \
            --build-arg no_proxy="${NO_PROXY}" \
            --build-arg RUN_WHEEL_CHECK=false \
            -t "local/byteiaas-vllm-wheel:${GITHUB_RUN_ID}" \
            .

      - name: Copy wheels from build stage
        run: |
          set -euo pipefail
          rm -rf byteiaas-wheel-dist
          mkdir -p byteiaas-wheel-dist
          container="$(docker create "local/byteiaas-vllm-wheel:${GITHUB_RUN_ID}")"
          trap 'docker rm -f "${container}" >/dev/null 2>&1 || true' EXIT
          docker cp "${container}:/workspace/dist/." byteiaas-wheel-dist/
          ls -lh byteiaas-wheel-dist
          test -n "$(find byteiaas-wheel-dist -maxdepth 1 -name '*.whl' -print -quit)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: byteiaas-wheel-dist/*.whl
          if-no-files-found: error
          retention-days: 14
