name: ByteIAAS Build vLLM Wheel

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Validated immutable commit SHA to checkout"
        required: true
        type: string
      cuda_version:
        description: "CUDA_VERSION build arg"
        required: false
        type: string
        default: "13.0.3"
      artifact_name:
        description: "Uploaded same-run component wheel artifact name"
        required: false
        type: string
        default: "vllm-cu130-wheel"

permissions:
  contents: read

jobs:
  build-wheel:
    if: github.repository == 'bytedance-iaas/vllm'
    runs-on:
      - self-hosted
      - x64-vllm-wheel-build-node
      - vllm-byteiaas-build-01
    timeout-minutes: 1440
    env:
      HTTP_PROXY: http://100.68.162.211:3128
      HTTPS_PROXY: http://100.68.162.211:3128
      ALL_PROXY: http://100.68.162.211:3128
      NO_PROXY: localhost,127.0.0.1,::1,mirrors.ivolces.com,mirrors.volces.com,.ivolces.com,.volceapi.com,.byted.org,eic-sdk-release.tos-cn-beijing.ivolces.com,scqq9isgq31i0fb8nt4eg.apigateway-cn-beijing.volceapi.com,bytedpypi.byted.org,mirrors.byted.org,iaas-gpu-cn-beijing.cr.volces.com,repo.almalinux.org,download.pytorch.org,astral.sh,releases.astral.sh,api.launchpad.net,launchpad.net,ppa.launchpad.net,ppa.launchpadcontent.net,keyserver.ubuntu.com
      BYTEIAAS_BUILDX_CACHE_ROOT: /data/buildkit/byteiaas-vllm-wheel-cache
      BYTEIAAS_UBUNTU_MIRROR: http://mirrors.volces.com/ubuntu
      BYTEIAAS_ALMALINUX_MIRROR: http://mirrors.volces.com/almalinux
      BYTEIAAS_EPEL_MIRROR: http://mirrors.volces.com/epel
      BYTEIAAS_PIP_INDEX_URL: https://mirrors.volces.com/pypi/simple
      BYTEIAAS_PIP_EXTRA_INDEX_URL: https://pypi.org/simple
      BYTEIAAS_MOONCAKE_GIT_REPOSITORY: https://github.com/wangyicong52/Mooncake.git
      BYTEIAAS_MOONCAKE_GIT_REF: vllm-dsv4.1
      BYTEIAAS_MOONCAKE_GIT_COMMIT: ffd73707e9dbfe0997053f3d82eab86d1568337e
      BYTEIAAS_CUDA_VERSION: ${{ inputs.cuda_version }}
    steps:
      - name: Validate immutable checkout ref
        env:
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
        run: |
          set -euo pipefail
          if ! [[ "${CHECKOUT_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::checkout_ref must be a full commit SHA"
            exit 1
          fi

      - name: Cleanup workspace
        run: |
          sudo find "${GITHUB_WORKSPACE}" -mindepth 1 -maxdepth 1 \
            -exec rm -rf -- {} +

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up uv for build input validation
        timeout-minutes: 5
        run: bash tools/byteiaas/setup_uv.sh

      - name: Validate build contract
        timeout-minutes: 5
        env:
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CHECKOUT_REF}"
          test "$(cat .github/byteiaas-build-contract)" = "3"
          uv venv --python python3 --no-python-downloads .venv
          .venv/bin/python -c 'import sys; assert sys.version_info >= (3, 10), sys.version'
          .venv/bin/python tools/byteiaas/validate_build_contract.py
          if [ "${BYTEIAAS_CUDA_VERSION}" != "13.0.3" ]; then
            echo "::error::ByteIAAS builds require CUDA 13.0.3"
            exit 1
          fi

      - name: Preflight supplemental Python index
        timeout-minutes: 2
        env:
          UV_INDEX_URL: ${{ env.BYTEIAAS_PIP_INDEX_URL }}
          UV_INDEX: ${{ env.BYTEIAAS_PIP_EXTRA_INDEX_URL }}
        run: |
          set -euo pipefail
          requirements="${RUNNER_TEMP}/byteiaas-supplemental-index.txt"
          printf '%s\n' 'xgrammar==0.2.8' > "${requirements}"
          uv pip compile "${requirements}" \
            --python .venv/bin/python \
            --python-version 3.12 \
            --python-platform x86_64-manylinux_2_28 \
            --no-python-downloads \
            --no-deps \
            --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cu130 \
            --output-file /dev/null

      - name: Set up Docker Buildx with local Docker Hub mirror
        id: buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver-opts: |
            network=host
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["127.0.0.1:5000"]
          cleanup: true

      - name: Preflight Mooncake system dependencies
        timeout-minutes: 10
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          # This target has no dependency on uv, PyTorch or native compilation.
          # The full build reuses its layers on this same BuildKit builder.
          cache_dir="${BYTEIAAS_BUILDX_CACHE_ROOT}/build"
          cache_args=()
          if [ -d "${cache_dir}" ]; then
            cache_args=(--cache-from "type=local,src=${cache_dir}")
          fi
          docker buildx build \
            --builder "${BUILDX_BUILDER}" \
            "${cache_args[@]}" \
            --target mooncake-system-deps \
            --platform linux/amd64 \
            --network=host \
            -f docker/Dockerfile \
            --build-arg CUDA_VERSION="${BYTEIAAS_CUDA_VERSION}" \
            --build-arg UBUNTU_MIRROR="${BYTEIAAS_UBUNTU_MIRROR}" \
            --build-arg HTTP_PROXY="${HTTP_PROXY}" \
            --build-arg HTTPS_PROXY="${HTTPS_PROXY}" \
            --build-arg ALL_PROXY="${ALL_PROXY}" \
            --build-arg NO_PROXY="${NO_PROXY}" \
            --build-arg http_proxy="${HTTP_PROXY}" \
            --build-arg https_proxy="${HTTPS_PROXY}" \
            --build-arg all_proxy="${ALL_PROXY}" \
            --build-arg no_proxy="${NO_PROXY}" \
            .

      - name: Build wheel stage image
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          set -euo pipefail
          build_cpus="$(nproc)"
          build_max_jobs="${BYTEIAAS_BUILD_MAX_JOBS:-${build_cpus}}"
          default_nvcc_threads=4
          if [ "${build_cpus}" -lt "${default_nvcc_threads}" ]; then
            default_nvcc_threads="${build_cpus}"
          fi
          build_nvcc_threads="${BYTEIAAS_BUILD_NVCC_THREADS:-${default_nvcc_threads}}"
          cache_root="${BYTEIAAS_BUILDX_CACHE_ROOT}"

          echo "Using build parallelism: max_jobs=${build_max_jobs}, nvcc_threads=${build_nvcc_threads}, cpus=${build_cpus}"
          echo "Native sources: checked-in docker/byteiaas/native source locks"
          echo "Docker root: $(docker info --format '{{.DockerRootDir}}')"
          df -h /data /data/docker /data/buildkit || true
          mkdir -p "${cache_root}"

          cache_dir="${cache_root}/build"
          cache_new="${cache_dir}.new"
          cache_old="${cache_dir}.old"
          cache_args=(--cache-to "type=local,dest=${cache_new},mode=max")
          if [ -d "${cache_dir}" ]; then
            cache_args=(
              --cache-from "type=local,src=${cache_dir}"
              "${cache_args[@]}"
            )
          fi

          rm -rf "${cache_new}"
          docker buildx build \
            --builder "${BUILDX_BUILDER}" \
            "${cache_args[@]}" \
            --load \
            --target byteiaas-wheel-artifacts \
            --platform linux/amd64 \
            --network=host \
            -f docker/Dockerfile \
            --build-arg CUDA_VERSION="${BYTEIAAS_CUDA_VERSION}" \
            --build-arg UBUNTU_MIRROR="${BYTEIAAS_UBUNTU_MIRROR}" \
            --build-arg ALMALINUX_MIRROR="${BYTEIAAS_ALMALINUX_MIRROR}" \
            --build-arg EPEL_MIRROR="${BYTEIAAS_EPEL_MIRROR}" \
            --build-arg PIP_INDEX_URL="${BYTEIAAS_PIP_INDEX_URL}" \
            --build-arg PIP_EXTRA_INDEX_URL="${BYTEIAAS_PIP_EXTRA_INDEX_URL}" \
            --build-arg UV_INDEX_URL="${BYTEIAAS_PIP_INDEX_URL}" \
            --build-arg UV_EXTRA_INDEX_URL="${BYTEIAAS_PIP_EXTRA_INDEX_URL}" \
            --build-arg UV_INDEX="${BYTEIAAS_PIP_EXTRA_INDEX_URL}" \
            --build-arg BYTEIAAS_BUILD_NATIVE=true \
            --build-arg BYTEIAAS_BUILD_TOKENIZERS=true \
            --build-arg BYTEIAAS_BUILD_ROUTER=true \
            --build-arg BUILD_NIXL=false \
            --build-arg INSTALL_NIXL=false \
            --build-arg BYTEIAAS_MOONCAKE_WHEEL_SOURCE=mooncake-build \
            --build-arg MOONCAKE_GIT_REPOSITORY="${BYTEIAAS_MOONCAKE_GIT_REPOSITORY}" \
            --build-arg MOONCAKE_GIT_REF="${BYTEIAAS_MOONCAKE_GIT_REF}" \
            --build-arg MOONCAKE_GIT_COMMIT="${BYTEIAAS_MOONCAKE_GIT_COMMIT}" \
            --build-arg VLLM_BUILD_COMMIT="${{ inputs.checkout_ref }}" \
            --build-arg max_jobs="${build_max_jobs}" \
            --build-arg nvcc_threads="${build_nvcc_threads}" \
            --build-arg HTTP_PROXY="${HTTP_PROXY}" \
            --build-arg HTTPS_PROXY="${HTTPS_PROXY}" \
            --build-arg ALL_PROXY="${ALL_PROXY}" \
            --build-arg NO_PROXY="${NO_PROXY}" \
            --build-arg http_proxy="${HTTP_PROXY}" \
            --build-arg https_proxy="${HTTPS_PROXY}" \
            --build-arg all_proxy="${ALL_PROXY}" \
            --build-arg no_proxy="${NO_PROXY}" \
            --build-arg RUN_WHEEL_CHECK=false \
            -t "local/byteiaas-vllm-wheel:${GITHUB_RUN_ID}" \
            .

          if [ -d "${cache_new}" ]; then
            rm -rf "${cache_old}"
            if [ -d "${cache_dir}" ]; then
              mv "${cache_dir}" "${cache_old}"
            fi
            mv "${cache_new}" "${cache_dir}"
            rm -rf "${cache_old}"
          fi

      - name: Copy and seal same-run build artifacts
        env:
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
        run: |
          set -euo pipefail
          rm -rf byteiaas-build-artifacts
          mkdir -p \
            byteiaas-build-artifacts/workspace \
            byteiaas-build-artifacts/tmp/ep_kernels_workspace \
            byteiaas-build-artifacts/tmp/triton_from_source_workspace
          container="$(docker create "local/byteiaas-vllm-wheel:${GITHUB_RUN_ID}")"
          trap 'docker rm -f "${container}" >/dev/null 2>&1 || true' EXIT
          docker cp "${container}:/source-commit" byteiaas-build-artifacts/
          for component in dist byteiaas-native-dist byteiaas-tokenizers-dist byteiaas-router-dist; do
            docker cp "${container}:/workspace/${component}" \
              byteiaas-build-artifacts/workspace/
          done
          for component in ep_kernels_workspace triton_from_source_workspace; do
            docker cp "${container}:/tmp/${component}/dist" \
              "byteiaas-build-artifacts/tmp/${component}/"
          done
          docker cp "${container}:/tmp/mooncake-dist" byteiaas-build-artifacts/tmp/
          .venv/bin/python tools/byteiaas/build_artifacts.py seal \
            --root byteiaas-build-artifacts \
            --checkout-ref "${CHECKOUT_REF}" --run-id "${GITHUB_RUN_ID}"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact_name }}
          path: byteiaas-build-artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Remove local wheel image
        if: ${{ always() }}
        run: docker image rm "local/byteiaas-vllm-wheel:${GITHUB_RUN_ID}" || true
