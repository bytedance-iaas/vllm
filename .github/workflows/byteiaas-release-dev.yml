name: ByteIAAS vLLM Development Build

on:
  push:
    branches:
      - iaas_main
  schedule:
    # Daily at 02:00 Asia/Shanghai.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Optional full SHA or tag; defaults to the workflow commit"
        required: false
        default: ""
      vllm_version:
        description: "Optional vLLM version override for image tag generation"
        required: false
        default: ""
      image_formats:
        description: "CSV of image formats to publish: oci,zstd,nydus"
        required: false
        default: "oci,zstd,nydus"

concurrency:
  group: byteiaas-vllm-dev-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-source:
    if: github.repository == 'bytedance-iaas/vllm'
    runs-on: ubuntu-22.04
    outputs:
      checkout_sha: ${{ steps.source.outputs.checkout_sha }}
    steps:
      - name: Checkout trusted branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/heads/iaas_main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve trusted immutable source
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          REQUESTED_REF: ${{ inputs.checkout_ref || github.sha }}
        run: |
          set -euo pipefail
          trusted_head="$(git rev-parse HEAD)"

          if [[ "${REQUESTED_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            source_ref="${REQUESTED_REF}"
          elif [ "${REQUESTED_REF}" = "refs/heads/iaas_main" ]; then
            source_ref="${trusted_head}"
          elif [[ "${REQUESTED_REF}" =~ ^refs/tags/[0-9A-Za-z][0-9A-Za-z_.-]*$ ]]; then
            source_ref="${REQUESTED_REF}"
          elif [[ "${REQUESTED_REF}" =~ ^[0-9A-Za-z][0-9A-Za-z_.-]*$ ]] && \
              git show-ref --verify --quiet "refs/tags/${REQUESTED_REF}"; then
            source_ref="refs/tags/${REQUESTED_REF}"
          else
            echo "::error::checkout_ref must be a full SHA, iaas_main, or a tag"
            exit 1
          fi

          checkout_sha="$(git rev-parse --verify "${source_ref}^{commit}")"
          is_workflow_sha=false
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && \
              [ "${checkout_sha}" = "${EVENT_SHA}" ]; then
            is_workflow_sha=true
          fi
          if [ "${is_workflow_sha}" != "true" ] && \
              ! git merge-base --is-ancestor \
                "${checkout_sha}" "${trusted_head}"; then
            echo "::error::Requested source is not in iaas_main history"
            exit 1
          fi
          contract="$(git show "${checkout_sha}:.github/byteiaas-build-contract")"
          if [ "${contract}" != "1" ]; then
            echo "::error::Requested source lacks ByteIAAS build contract 1"
            exit 1
          fi
          echo "checkout_sha=${checkout_sha}" >> "${GITHUB_OUTPUT}"

  build-wheel:
    if: github.repository == 'bytedance-iaas/vllm'
    needs: resolve-source
    uses: ./.github/workflows/_byteiaas-build-wheel.yml
    with:
      checkout_ref: ${{ needs.resolve-source.outputs.checkout_sha }}
      cuda_version: "13.0.3"
      artifact_name: vllm-cu130-wheel-dev

  build-image:
    if: github.repository == 'bytedance-iaas/vllm'
    needs: resolve-source
    uses: ./.github/workflows/_byteiaas-build-and-publish-image.yml
    with:
      checkout_ref: ${{ needs.resolve-source.outputs.checkout_sha }}
      cuda_version: "13.0.3"
      tag_mode: dev
      vllm_version: ${{ github.event_name == 'workflow_dispatch' && inputs.vllm_version || '' }}
      image_formats: ${{ github.event_name == 'workflow_dispatch' && inputs.image_formats || 'oci,zstd,nydus' }}
    secrets:
      VOLCENGINE_CR_USERNAME: ${{ secrets.VOLCENGINE_CR_USERNAME }}
      VOLCENGINE_CR_PASSWORD: ${{ secrets.VOLCENGINE_CR_PASSWORD }}
